[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cellproof"
version = "0.3.1"
description = "Turn an Excel workbook into SQL (a dbt project on DuckDB) and prove every number matches."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Nikhil414" }]
keywords = ["excel", "xlsx", "sql", "dbt", "duckdb", "migration", "spreadsheet"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
]
dependencies = ["openpyxl>=3.1", "duckdb>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "jinja2>=3.1"]
dbt = ["dbt-duckdb>=1.8"]
compute = ["formulas>=1.3.4,<1.4"]

[project.urls]
Homepage = "https://github.com/Nikhil414/cellproof"
Issues = "https://github.com/Nikhil414/cellproof/issues"

[project.scripts]
cellproof = "cellproof.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cellproof"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
